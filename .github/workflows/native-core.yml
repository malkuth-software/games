name: Native game core checks
# On main the installable build already compiles and runs every one of these tests on
# all four platforms, so this matrix runs only for pull requests.
on:
  # Called by applications.yml, whose "PlaySuite CI summary" job stands for every check
  # of a pull request; run by hand from the Actions tab.
  # Pull requests only: the release takes these results from the merged pull request's
  # run (tools/test_reuse.py collect), and the application jobs test the same cores.
  workflow_call:
  workflow_dispatch:
permissions:
  contents: read
  actions: read  # tools/test_reuse.py reads earlier runs' results
jobs:
  native:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-2022
            platform: windows-x64
            shell: 'msys2 {0}'
          - runner: macos-15
            platform: macos-arm64
            shell: bash
          - runner: ubuntu-24.04
            platform: linux-x64
            shell: bash
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
            shell: bash
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: ${{ matrix.shell }}
    steps:
      - uses: actions/checkout@v4
      # The pinned template_harness (harness.lock) at ./template_harness.
      - uses: ./.github/actions/harness-checkout
      - uses: actions/setup-python@v5
        if: runner.os == 'Windows'
        with:
          python-version: '3.14'
      # GUI.Forms publishes the MSYS2 tree its cache was compiled with (the harness's
      # windows_toolchain.json names it; projects/games.toml reads GUI.Forms' releases).
      # Restoring it avoids the MSYS2 mirrors and guarantees the compiler the cache
      # needs; without a published tree the job stops rather than install another.
      - name: Restore GUI.Forms' Windows toolchain
        if: runner.os == 'Windows'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python template_harness/harness/windows_toolchain.py restore
      - name: Install macOS tools
        if: runner.os == 'macOS'
        run: brew install ninja
      - name: Install Linux tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ninja-build
      - name: Configure the complete portable game core
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DGAMES_BUILD_APPLICATION=OFF
      - name: Build
        run: cmake --build build --parallel 4
